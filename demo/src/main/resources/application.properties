# ==========================================
# Konfigurasi Aplikasi Spring Boot + Camunda
# ==========================================

# Nama Aplikasi
spring.application.name=demo

# Server Port
server.port=8080

# ==========================================
# Konfigurasi Camunda BPM
# ==========================================

# Admin User untuk login ke Camunda Webapp
camunda.bpm.admin-user.id=demo
camunda.bpm.admin-user.password=demo
camunda.bpm.admin-user.firstName=Demo
camunda.bpm.admin-user.lastName=Admin

# Filter default agar Tasklist bisa dipakai langsung
camunda.bpm.filter.create=All tasks

# ==========================================
# Konfigurasi Database H2 In-Memory
# ==========================================
spring.datasource.url=jdbc:h2:mem:camunda;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Aktifkan H2 Console untuk debugging
spring.h2.console.enabled=true
